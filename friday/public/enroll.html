<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friday — Voice Enrolment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #13131a;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #1e1e2e;
      border: 1px solid #3a3a4a;
      border-radius: 10px;
      color: #e8e8f0;
      font-size: 1rem;
      padding: 12px 16px;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus { border-color: #6060ff; }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 10px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #btnEnroll { background: #4040cc; color: #fff; }
    .progress-wrap {
      background: #1e1e2e;
      border-radius: 8px;
      height: 10px;
      margin: 16px 0 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: #6060ff;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-label {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      min-height: 24px;
    }
    .status.ok { color: #44cc88; }
    .status.err { color: #ff6666; }
    .enrolled-list { margin-top: 28px; border-top: 1px solid #2a2a3a; padding-top: 20px; }
    .enrolled-list h3 { font-size: 0.85rem; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .speaker-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e1e2e;
      border: 1px solid #3a3a4a;
      border-radius: 20px;
      padding: 6px 14px;
      margin: 4px;
      font-size: 0.85rem;
    }
    .speaker-chip button {
      background: none;
      border: none;
      color: #ff6666;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      width: auto;
      font-weight: 400;
      margin-bottom: 0;
    }
    .hint { font-size: 0.78rem; color: #555; margin-top: -14px; margin-bottom: 18px; }
  </style>
</head>
<body>
<div class="card">
  <h1>Voice Enrolment</h1>
  <p class="sub">Friday learns your voice using Picovoice Eagle. Speak naturally for about 30 seconds — tell her about yourself, your day, anything.</p>

  <label for="accessKey">Picovoice AccessKey</label>
  <input type="password" id="accessKey" placeholder="Paste key from console.picovoice.ai" autocomplete="off" />
  <p class="hint">Free personal key — get it at <a href="https://console.picovoice.ai/" target="_blank" style="color:#6060ff">console.picovoice.ai</a></p>

  <label for="nameInput">Your name</label>
  <input type="text" id="nameInput" placeholder="e.g. Nick" autocomplete="off" />

  <button id="btnEnroll">Start Enrolment</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">0% enrolled — keep speaking…</div>

  <div class="status" id="status">Enter your name and AccessKey, then press Start.</div>

  <div class="enrolled-list" id="enrolledSection" style="display:none">
    <h3>Enrolled speakers</h3>
    <div id="speakerChips"></div>
  </div>
</div>

<script src="/eagle/eagle-web.js"></script>
<script>
  const accessKeyEl = document.getElementById("accessKey");
  const nameInput   = document.getElementById("nameInput");
  const btnEnroll   = document.getElementById("btnEnroll");
  const progressWrap  = document.getElementById("progressWrap");
  const progressBar   = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");
  const statusEl    = document.getElementById("status");

  // Restore saved access key
  const savedKey = localStorage.getItem("picovoice_access_key");
  if (savedKey) accessKeyEl.value = savedKey;

  function setStatus(msg, cls = "") { statusEl.textContent = msg; statusEl.className = "status " + cls; }
  function setProgress(pct) {
    progressWrap.style.display = "block";
    progressLabel.style.display = "block";
    progressBar.style.width = pct + "%";
    progressLabel.textContent = pct < 100
      ? `${pct}% enrolled — keep speaking…`
      : "100% — finishing up…";
  }

  renderChips();

  let enrolling = false;
  let profiler = null;
  let audioCtx = null;
  let processor = null;
  let micStream = null;
  let pcmQueue = [];
  let draining = false;

  btnEnroll.addEventListener("click", async () => {
    if (enrolling) {
      stopEnrollment("Enrolment cancelled.");
      return;
    }

    const name = nameInput.value.trim();
    const accessKey = accessKeyEl.value.trim();
    if (!name)       { setStatus("Please enter your name.", "err"); return; }
    if (!accessKey)  { setStatus("Please enter your Picovoice AccessKey.", "err"); return; }
    if (typeof EagleWeb === "undefined") {
      setStatus("Eagle SDK not loaded. Reload the page.", "err");
      return;
    }

    localStorage.setItem("picovoice_access_key", accessKey);

    btnEnroll.textContent = "Stop";
    btnEnroll.disabled = false;
    enrolling = true;
    pcmQueue = [];
    draining = false;
    setStatus("Loading Eagle model…");

    try {
      profiler = await EagleWeb.EagleProfiler.create(accessKey, { publicPath: "/eagle/eagle_params.pv" });
    } catch (e) {
      stopEnrollment("Eagle init failed: " + e.message, true);
      return;
    }

    const RATE = 16000;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      stopEnrollment("Microphone access denied.", true);
      return;
    }

    // Try to open context at 16kHz for direct feed (desktop browsers honour this)
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
    const source = audioCtx.createMediaStreamSource(micStream);
    const frameLen = profiler.frameLength || 512;
    processor = audioCtx.createScriptProcessor(frameLen, 1, 1);
    let leftover = new Float32Array(0);

    processor.onaudioprocess = (e) => {
      if (!enrolling) return;
      const raw = e.inputBuffer.getChannelData(0);
      const merged = new Float32Array(leftover.length + raw.length);
      merged.set(leftover);
      merged.set(raw, leftover.length);

      let pos = 0;
      while (pos + frameLen <= merged.length) {
        const frame = merged.slice(pos, pos + frameLen);
        pos += frameLen;
        const pcm = new Int16Array(frameLen);
        for (let i = 0; i < frameLen; i++) {
          pcm[i] = Math.max(-32768, Math.min(32767, Math.round(frame[i] * 32768)));
        }
        pcmQueue.push(pcm);
      }
      leftover = merged.slice(pos);
      if (!draining) drainQueue(name);
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
    setStatus("Speak naturally for about 30 seconds…");
    setProgress(0);
  });

  async function drainQueue(name) {
    draining = true;
    while (enrolling && pcmQueue.length > 0) {
      const frame = pcmQueue.shift();
      let pct;
      try {
        pct = await profiler.enroll(frame);
      } catch (e) {
        stopEnrollment("Enrolment error: " + e.message, true);
        return;
      }
      const pctInt = Math.round(pct * 100);
      setProgress(pctInt);
      if (pct >= 1.0) {
        await finishEnrollment(name);
        return;
      }
    }
    draining = false;
  }

  async function finishEnrollment(name) {
    enrolling = false;
    stopAudioCapture();
    setStatus("Saving voice profile…");
    try {
      await profiler.flush();
      const profile = await profiler.export();
      await profiler.release();
      profiler = null;

      // Encode bytes as base64
      let bin = "";
      for (let i = 0; i < profile.bytes.length; i++) bin += String.fromCharCode(profile.bytes[i]);
      const b64 = btoa(bin);

      const speakers = JSON.parse(localStorage.getItem("eagle_speakers") || "[]");
      // Replace existing profile for same name
      const idx = speakers.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
      if (idx >= 0) speakers[idx] = { name, profileBytes: b64 };
      else speakers.push({ name, profileBytes: b64 });
      localStorage.setItem("eagle_speakers", JSON.stringify(speakers));

      progressWrap.style.display = "none";
      progressLabel.style.display = "none";
      setProgress(100);
      setStatus(`${name} enrolled! Friday will recognise your voice.`, "ok");
      btnEnroll.textContent = "Start Enrolment";
      nameInput.value = "";
      renderChips();
    } catch (e) {
      setStatus("Export failed: " + e.message, "err");
      btnEnroll.textContent = "Start Enrolment";
    }
  }

  function stopAudioCapture() {
    try { if (processor) { processor.disconnect(); processor.onaudioprocess = null; } } catch (_) {}
    try { if (audioCtx) audioCtx.close(); } catch (_) {}
    try { if (micStream) micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
    processor = null; audioCtx = null; micStream = null;
  }

  function stopEnrollment(msg, isErr = false) {
    enrolling = false;
    draining = false;
    pcmQueue = [];
    stopAudioCapture();
    if (profiler) { try { profiler.release(); } catch (_) {} profiler = null; }
    progressWrap.style.display = "none";
    progressLabel.style.display = "none";
    btnEnroll.textContent = "Start Enrolment";
    btnEnroll.disabled = false;
    setStatus(msg, isErr ? "err" : "");
  }

  function renderChips() {
    const section = document.getElementById("enrolledSection");
    const chips   = document.getElementById("speakerChips");
    let speakers = [];
    try { speakers = JSON.parse(localStorage.getItem("eagle_speakers") || "[]"); } catch (_) {}
    if (!speakers.length) { section.style.display = "none"; return; }
    section.style.display = "block";
    chips.innerHTML = speakers.map((s, i) =>
      `<span class="speaker-chip">${s.name} <button onclick="removeSpeaker(${i})">remove</button></span>`
    ).join("");
  }

  function removeSpeaker(idx) {
    let speakers = [];
    try { speakers = JSON.parse(localStorage.getItem("eagle_speakers") || "[]"); } catch (_) {}
    speakers.splice(idx, 1);
    localStorage.setItem("eagle_speakers", JSON.stringify(speakers));
    renderChips();
  }
</script>
</body>
</html>
