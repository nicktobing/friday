<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Friday" />
  <title>Friday</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <button id="enrollBtn" class="icon-btn" aria-label="Enrol your voice" title="Enrol your voice">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <button id="orb" class="orb" aria-label="Tap to talk to Friday">
      <span class="orb-core"></span>
      <span class="orb-ring"></span>
    </button>

    <p id="status" class="status">Tap to wake Friday</p>

    <div id="transcript" class="transcript" aria-live="polite"></div>
  </main>

  <!-- Voice enrolment panel — lives on the main page so the voiceprint it saves
       is in the same origin/storage Friday reads from. No tab-switching. -->
  <div id="enrollOverlay" class="enroll-overlay" hidden>
    <div class="enroll-card" role="dialog" aria-modal="true" aria-labelledby="enrollTitle">
      <button id="enrollClose" class="enroll-close" aria-label="Close">&times;</button>
      <h2 id="enrollTitle">Enrol your voice</h2>
      <p class="enroll-sub">Friday learns your voice from a 25-second sample. Speak naturally — about your day, your work, anything.</p>

      <input type="text" id="enrollName" placeholder="Your name (e.g. Nick)" autocomplete="off" />
      <button id="enrollRecord" class="enroll-record">Start Recording</button>

      <div id="enrollTimer" class="enroll-timer">0s</div>
      <div class="enroll-progress-wrap"><div id="enrollProgress" class="enroll-progress-bar"></div></div>
      <p id="enrollStatus" class="enroll-status">Enter your name and tap Start Recording.</p>

      <div id="enrollList" class="enroll-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
